version: '3.8'

services:
  backend:
    build: ./backend
    container_name: payroll_backend
    volumes:
      - ./backend:/code            # MOUNT to /code in container
    working_dir: /code             # Ensures correct execution path
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build: ./frontend
    container_name: payroll_frontend
    volumes:
      - ./frontend:/frontend       # MOUNT to /frontend in container
    working_dir: /frontend         # Ensures npm runs in right path
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    command: npm start
