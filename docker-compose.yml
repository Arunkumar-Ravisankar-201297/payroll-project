
services:
  mysql:
    image: mysql:8.0
    container_name: payroll_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 412315114010@  # Root password only
      MYSQL_DATABASE: payroll_db          # Create default database
    ports:
      - "3307:3306"                       # Map host 3307 to container 3306
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: payroll_backend
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_NAME: payroll_db
      DB_USER: root
      DB_PASS: 412315114010@
    volumes:
      - ./backend:/code
    working_dir: /code
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build: ./frontend
    container_name: payroll_frontend
    volumes:
      - ./frontend:/frontend
    working_dir: /frontend
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    command: npm start

volumes:
  mysql_data:
